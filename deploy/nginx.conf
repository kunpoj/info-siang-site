# info.siang.co, static site (written by install.sh)
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root __ROOT__;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    location ~* ^/assets/(art|fonts|brand|tex|audio)/ { expires 30d; add_header Cache-Control "public"; add_header X-Robots-Tag "noindex, nofollow" always; }
    location ~* ^/assets/ { expires 5m; add_header X-Robots-Tag "noindex, nofollow" always; }
    location = /gallery/ { return 301 /for/#gallery; }
    location = /festival/ { return 301 /for/#festival; }
    location = /venue/ { return 301 /for/#venue; }
    location = /organiser/ { return 301 /for/#organiser; }
    location = /en/gallery/ { return 301 /en/for/#gallery; }
    location = /en/festival/ { return 301 /en/for/#festival; }
    location = /en/venue/ { return 301 /en/for/#venue; }
    location = /en/organiser/ { return 301 /en/for/#organiser; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
