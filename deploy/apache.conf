# info.siang.co, static site (written by install.sh)
<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot __ROOT__
    <Directory __ROOT__>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set X-Content-Type-Options "nosniff"
    RedirectMatch 404 /\.
    Redirect 301 /gallery/ /for/#gallery
    Redirect 301 /festival/ /for/#festival
    Redirect 301 /venue/ /for/#venue
    Redirect 301 /organiser/ /for/#organiser
</VirtualHost>
